name: Android CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Package project source
        run: |
          zip -r COPY-Android-Source.zip . \
            -x ".git/*" "*/.git/*" ".gradle/*" "*/build/*" \
               "local.properties" "*/local.properties" "*.jks" "*.keystore" \
               ".env" ".env.*" "COPY-Android-Source.zip" \
               "app/src/main/assets/models/*.litertlm" "app/src/main/assets/models/*.download"

      - name: Upload project source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: COPY-Android-Source
          path: COPY-Android-Source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source without build outputs or secrets
        run: |
          zip -r COPY-Android-Source.zip . \
            -x ".git/*" "*/.git/*" ".gradle/*" "*/build/*" \
               "local.properties" "*/local.properties" "*.jks" "*.keystore" \
               ".env" ".env.*" "COPY-Android-Source.zip"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: COPY-Android-Source
          path: COPY-Android-Source.zip
          if-no-files-found: error
          retention-days: 7
